<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ezan</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ezan">
<meta name="theme-color" content="#120d16">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120d16;
    --surface:#1c1420;
    --surface-2:#241a29;
    --line:#3a2a3f;
    --ink:#f2e9d8;
    --ink-dim:#b3a2a8;
    --lamp:#c9a24b;
    --lamp-dim:#7d6530;
    --good:#7fae7a;
    --bad:#b5443a;
    --arabic:#e3c583;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 600px at 15% -10%, rgba(201,162,75,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,162,75,0.06), transparent 55%),
      radial-gradient(ellipse 1000px 800px at 50% 120%, rgba(90,50,110,0.18), transparent 60%);
    background-attachment: fixed;
  }
  #root{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 20px 14px 20px;border-bottom:1px solid var(--line);
  }
  header.top .brand{
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:0.3px;
    background: linear-gradient(120deg, var(--ink) 20%, var(--lamp) 50%, var(--ink) 80%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header.top .brand span{color:var(--lamp);}
  .icon-btn{
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;
  }
  .icon-btn:hover{border-color:var(--lamp-dim);color:var(--ink);}

  main{flex:1;padding:20px;padding-bottom:60px;}

  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-btn{
    background:none;border:none;color:var(--ink-dim);cursor:pointer;
    font-family:'Inter',sans-serif;font-size:14px;display:flex;align-items:center;gap:6px;padding:4px 0;
  }
  .back-btn:hover{color:var(--lamp);}

  .subject-grid{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .subject-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;cursor:pointer;transition:border-color .15s;
    display:flex;justify-content:space-between;align-items:center;
  }
  .subject-card:hover{border-color:var(--lamp-dim);}
  .subject-card .name{font-family:'Fraunces',serif;font-size:19px;}
  .subject-card .meta{font-size:12px;color:var(--ink-dim);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
  .subject-card .arrow{color:var(--lamp);font-size:20px;}

  .choice-grid{display:flex;flex-direction:column;gap:12px;}
  .choice-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    cursor:pointer;transition:border-color .15s;
  }
  .choice-card:hover{border-color:var(--lamp-dim);}
  .choice-card .name{font-family:'Fraunces',serif;font-size:18px;margin-bottom:4px;}
  .choice-card .desc{font-size:13px;color:var(--ink-dim);line-height:1.5;}

  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;
  }
  .panel h3{font-size:16px;margin-bottom:10px;}
  textarea{
    width:100%;min-height:120px;background:var(--surface-2);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--lamp-dim);}
  input[type=file]{color:var(--ink-dim);font-size:13px;}
  input[type=text]{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px;font-family:'Inter',sans-serif;font-size:15px;
  }
  input[type=text]:focus{outline:none;border-color:var(--lamp-dim);}

  .btn{
    background:var(--lamp);color:#1a1408;border:none;border-radius:10px;padding:12px 18px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s;
  }
  .btn:hover{opacity:0.88;}
  .btn:disabled{opacity:0.4;cursor:default;}
  .btn.secondary{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn.secondary:hover{border-color:var(--lamp-dim);}
  .btn.danger{background:none;border:1px solid var(--bad);color:var(--bad);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  .tab-row{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 4px;margin-right:14px;font-size:14px;color:var(--ink-dim);cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--lamp);border-bottom-color:var(--lamp);}

  .stage-track{display:flex;gap:6px;margin-bottom:22px;}
  .stage-dot{flex:1;height:5px;border-radius:3px;background:var(--line);}
  .stage-dot.filled{background:var(--lamp);}
  .stage-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);margin-bottom:18px;letter-spacing:0.4px;}

  .card-word{
    text-align:center;margin:18px 0 10px 0;
  }
  .card-word .term{font-family:'Fraunces',serif;font-size:38px;font-weight:600;}
  .card-word .sentence{
    margin-top:14px;color:var(--ink-dim);font-size:15px;font-style:italic;line-height:1.6;padding:0 8px;
  }

  .options-grid{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
  .option-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:14px 16px;font-size:17px;text-align:right;direction:rtl;
    cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .15s;
  }
  .option-btn:hover{border-color:var(--lamp-dim);}
  .option-btn.correct{border-color:var(--good);background:rgba(111,191,122,0.12);}
  .option-btn.wrong{border-color:var(--bad);background:rgba(226,87,76,0.12);}

  .recall-row{margin-top:26px;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .recall-row input{text-align:right;direction:rtl;font-size:18px;}

  .hint-row{display:flex;justify-content:center;margin-top:16px;}
  .hint-btn{
    background:none;border:1px dashed var(--lamp-dim);color:var(--lamp);border-radius:20px;
    padding:8px 16px;font-size:13px;cursor:pointer;
  }
  .hint-btn:disabled{opacity:0.3;cursor:default;}
  .hint-box{
    margin-top:12px;padding:12px 14px;background:rgba(217,164,65,0.08);border:1px solid var(--lamp-dim);
    border-radius:10px;font-size:13.5px;color:var(--ink);line-height:1.5;
  }

  .reveal-box{
    margin-top:18px;text-align:center;padding:14px;border-radius:10px;background:var(--surface-2);
  }
  .reveal-box .ans{font-family:'Fraunces',serif;font-size:20px;color:var(--arabic);direction:rtl;}

  #flash-overlay{
    position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:50;
    transition:opacity .08s;
  }
  #flash-overlay.on{opacity:0.35;}

  .streak-bar{display:flex;gap:5px;margin-top:16px;justify-content:center;}
  .streak-pip{width:14px;height:14px;border-radius:50%;background:var(--line);}
  .streak-pip.filled{background:var(--good);}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-dim);
  }
  .empty-state h3{color:var(--ink);margin-bottom:8px;font-size:19px;}

  table{width:100%;border-collapse:collapse;margin-top:8px;}
  td{padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px;}
  td.ar{text-align:right;direction:rtl;color:var(--arabic);font-family:'Fraunces',serif;}
  td.del{width:30px;text-align:center;color:var(--ink-dim);cursor:pointer;}
  td.del:hover{color:var(--bad);}

  .diff-row{display:flex;gap:10px;margin-top:10px;}
  .diff-btn{
    flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:14px;
  }
  .diff-btn:hover{border-color:var(--lamp-dim);}
  .diff-btn.active{border-color:var(--lamp);color:var(--lamp);}

  .fact-check{
    display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
    cursor:pointer;
  }
  .fact-check:hover{border-color:var(--lamp-dim);}
  .fact-check input{margin-top:3px;}
  .fact-check .txt{font-size:14px;line-height:1.5;}

  .score-big{font-family:'Fraunces',serif;font-size:44px;text-align:center;color:var(--lamp);margin:20px 0 6px 0;}
  .spin{
    width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lamp);
    animation:spin 0.8s linear infinite;display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-row{display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:14px;margin-top:10px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-2);
    border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-size:13px;z-index:60;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  .save-note{font-size:12px;color:var(--ink-dim);margin-top:8px;}
  .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--lamp);
    border:1px solid var(--lamp-dim);border-radius:12px;padding:2px 8px;margin-left:8px;letter-spacing:0.3px;
  }
</style>
</head>

function speak(text, lang){
  if(!('speechSynthesis' in window) || !text) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    window.speechSynthesis.speak(u);
  }catch(e){ console.error(e); }
}

function speakBtn(text, lang){
  const b = document.createElement('button');
  b.className = 'icon-btn';
  b.style.width = '30px'; b.style.height='30px'; b.style.fontSize='13px'; b.style.flexShrink='0';
  b.innerHTML = '🔊';
  b.title = 'Read aloud';
  b.onclick = (e)=>{ e.stopPropagation(); speak(text, lang); };
  return b;
}

async function translateWordByWord(text){
  const wordCount = text.trim().split(/\s+/).length;
  const prompt = `Break this exact sentence into its individual words, one entry per word, in the original order. Do NOT summarize, merge words together, or give one overall translation — I need EVERY single word listed separately, even short ones like "the", "is", "a", "und", "le". The sentence has ${wordCount} words, so your array must have exactly ${wordCount} entries.
For each word, give its Arabic meaning as used in THIS sentence (not a random dictionary sense).
Respond with ONLY a raw JSON array, no markdown fences, no commentary, no summary. Schema:
[{"w":"word exactly as it appears (punctuation attached is fine)","ar":"معناه هنا"}]

Sentence to break down, word by word: "${text}"`;
  return await callClaude([{type:'text', text: prompt}]);
}

const translateCache = new Map();

function makeTranslate(text){
  const btn = document.createElement('button');
  btn.className = 'icon-btn';
  btn.style.width = '30px'; btn.style.height='30px'; btn.style.fontSize='12px'; btn.style.flexShrink='0';
  btn.innerHTML = 'ع';
  btn.title = 'Translate word by word';
  const box = document.createElement('div');
  box.style.display='none';
  box.style.marginTop='12px';
  box.style.padding='12px';
  box.style.background='var(--surface-2)';
  box.style.border='1px solid var(--line)';
  box.style.borderRadius='10px';
  function renderPairs(pairs){
    box.innerHTML = '';
    const flexWrap = document.createElement('div');
    flexWrap.style.display='flex'; flexWrap.style.flexWrap='wrap'; flexWrap.style.gap='14px'; flexWrap.style.justifyContent='center';
    pairs.forEach(p=>{
      const item = document.createElement('div');
      item.style.textAlign='center';
      item.innerHTML = `<div style="font-size:14px;">${p.w}</div><div style="font-size:13px;color:var(--arabic);direction:rtl;margin-top:2px;">${p.ar}</div>`;
      flexWrap.appendChild(item);
    });
    box.appendChild(flexWrap);
  }
  btn.onclick = async (e)=>{
    e.stopPropagation();
    if(box.style.display==='block'){ box.style.display='none'; return; }
    box.style.display='block';
    if(translateCache.has(text)){
      renderPairs(translateCache.get(text));
      return;
    }
    box.innerHTML = `<div class="loading-row" style="margin:0;"><span class="spin"></span> Translating…</div>`;
    try{
      const pairs = await translateWordByWord(text);
      translateCache.set(text, pairs);
      renderPairs(pairs);
    }catch(err){
      box.innerHTML = `<div style="font-size:13px;color:var(--bad);">Could not translate — try again.</div>`;
    }
  };
  return {btn, box};
}

let memoryStore = {}; // session-only storage for "No History" decks — resets on reload, never saved

// When logged in, everything durable goes to Firestore under this user's own document
// (so it follows them to any device); otherwise it falls back to this browser's localStorage.
async function fsGet(key){
  const ref = window.__firebase.doc(fbDb, 'users', currentUser.uid, 'data', key.replace(/\//g,'_'));
  const snap = await window.__firebase.getDoc(ref);
  return snap.exists() ? snap.data().value : null;
}
async function fsSet(key, value){
  const ref = window.__firebase.doc(fbDb, 'users', currentUser.uid, 'data', key.replace(/\//g,'_'));
  await window.__firebase.setDoc(ref, { value });
}

async function getDeck(key, ephemeral){

    const v = memoryStore['deck:'+key];

  if(currentUser && fbDb){
    try{ const v = await fsGet('deck:'+key); return v ? JSON.parse(v) : []; }

}

function getApiKey(){
  return localStorage.getItem('ezan:api_key') || '';
}
function getModel(){
  return localStorage.getItem('ezan:model') || 'gemini-3.6-flash';
}

function exportBackup(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('ezan:') && k!=='ezan:api_key'){
      data[k] = localStorage.getItem(k);
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ezan-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup downloaded.');
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      let count = 0;
      Object.keys(data).forEach(k=>{
        if(k.startsWith('ezan:') && k!=='ezan:api_key'){ localStorage.setItem(k, data[k]); count++; }
      });
      toast(`Restored ${count} item(s). Reloading…`);
      setTimeout(()=>location.reload(), 900);
    }catch(e){
      toast('Could not read that backup file — is it the right one?');
    }
  };
  reader.readAsText(file);
}

// Converts our internal Anthropic-style content blocks ({type:'text'|'image', ...})
// into Gemini's "parts" format, so the rest of the app never has to know which AI it's talking to.
function toGeminiParts(content){
  return content.map(block=>{
    if(block.type==='text') return {text: block.text};
    if(block.type==='image') return {inlineData:{mimeType: block.source.media_type, data: block.source.data}};
    return null;
  }).filter(Boolean);
}

async function callClaude(content, attempt){
  attempt = attempt || 1;
  const apiKey = getApiKey();
  if(!apiKey){
    throw new Error('Add your Gemini API key in Settings first (top-right ⚙).');
  }
  const model = getModel();
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents: [{role:'user', parts: toGeminiParts(content)}],
      generationConfig: { maxOutputTokens: 16000 }
    })
  });
  if(!resp.ok){
    let errBody = null;
    try{ errBody = await resp.json(); }catch(e){}
    if(resp.status===400 || resp.status===403) throw new Error('Your Gemini API key was rejected — check it in Settings.');

    if(resp.status===429 || resp.status===503){
      // Google tells us exactly how long to wait (RetryInfo.retryDelay) and which quota
      // was hit (QuotaFailure.violations[].quotaId) — read both instead of guessing.
      const details = (errBody && errBody.error && errBody.error.details) || [];
      const retryInfo = details.find(d => d['@type'] && d['@type'].includes('RetryInfo'));
      const quotaInfo = details.find(d => d['@type'] && d['@type'].includes('QuotaFailure'));
      const quotaId = quotaInfo && quotaInfo.violations && quotaInfo.violations[0] && quotaInfo.violations[0].quotaId || '';
      const isDailyLimit = /PerDay/i.test(quotaId);
      let waitSeconds = null;
      if(retryInfo && retryInfo.retryDelay){
        const m = String(retryInfo.retryDelay).match(/(\d+(\.\d+)?)/);
        if(m) waitSeconds = Math.ceil(parseFloat(m[1]));
      }

      if(isDailyLimit){
        // Waiting won't help within the same session — this resets at midnight Pacific time, not per-minute.
        throw new Error('You\'ve used up today\'s free Gemini requests for this key. This resets once a day (around 10am Egypt time) — not something waiting a few minutes fixes. Try again later, or add a different API key in Settings.');
      }

      if(resp.status===503 && attempt < 3){
        await new Promise(r=>setTimeout(r, attempt * 2000));
        return callClaude(content, attempt + 1);
      }
      if(resp.status===429){
        if(waitSeconds && attempt < 3){
          await new Promise(r=>setTimeout(r, (waitSeconds + 1) * 1000));
          return callClaude(content, attempt + 1);
        }
        const waitMsg = waitSeconds ? `about ${waitSeconds} seconds` : 'about a minute';
        throw new Error(`Gemini's per-minute limit was hit — wait ${waitMsg} and try again. (Free-tier keys only allow a small number of requests per minute.)`);
      }
      throw new Error('Gemini is overloaded right now — wait a bit and try again.');
    }
    throw new Error('API error ' + resp.status + ' ' + JSON.stringify(errBody||{}));
  }
  const data = await resp.json();
  const candidate = data.candidates && data.candidates[0];
  if(!candidate){
    throw new Error('No response from Gemini — try again.');
  }
  if(candidate.finishReason === 'MAX_TOKENS'){
    throw new Error('Response got cut off (too much content) — try uploading a shorter piece of material.');
  }
  const textBlocks = (candidate.content && candidate.content.parts || []).map(p=>p.text||'').join('\n');
  let clean = textBlocks.replace(/```json/g,'').replace(/```/g,'').trim();
  // Extract the outermost JSON array/object in case there's stray text around it
  const firstBracket = clean.search(/[\[{]/);
  const lastBracket = Math.max(clean.lastIndexOf(']'), clean.lastIndexOf('}'));
  if(firstBracket !== -1 && lastBracket !== -1 && lastBracket > firstBracket){
    clean = clean.slice(firstBracket, lastBracket + 1);
  }
  try{
    return JSON.parse(clean);
  }catch(e){
    console.error('Raw model output:', textBlocks);
    throw new Error('Could not understand the response — please try again.');
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function fileToText(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsText(file);
  });
}

async function extractVocab(text, imageFile, language){
  const lang = language || 'English';
  const germanRule = lang === 'German' ? `
GERMAN-SPECIFIC RULES (important, follow exactly):
- If the term is a noun, the "term" field MUST include the correct definite article as part of the word itself — e.g. "der Tisch", "die Frau", "das Buch". Never give a bare noun without its article.
- If the term is a verb, also provide a "pastForm" field with its past participle (Partizip II) — e.g. for "machen" give "gemacht", for "gehen" give "gegangen". Leave "pastForm" as an empty string "" for nouns and everything else.` : `
- Include a "pastForm" field in every item, always as an empty string "" (not used for this language).`;
  const prompt = `You are building language-study flashcards from material a student uploaded. The student is practicing ${lang}.
Go through the ENTIRE content and extract EVERY distinct ${lang} word or term worth studying — do not skip any, do not cap the count, cover it all completely (skip only trivial/common function words like "the", "a", "und", "le" that aren't worth studying on their own).
For each term, provide:
- "term": the word/phrase exactly as it should be studied
- "meaning_ar": the single best, most common Arabic meaning (natural, accurate) — this is what's used for multiple-choice
- "meaning_alts": an array of OTHER genuinely correct Arabic meanings for this word, if the word has more than one valid sense (e.g. a word meaning both "light" and "lamp"). If it only really has one meaning, return an empty array [].
- "sentences": exactly 3 different example sentences in ${lang} using the term naturally (must be different from each other)
- "distractors": exactly 3 plausible-but-wrong Arabic meanings (near-meanings, not obviously silly)
- "mnemonic": one short memorization aid (a trick, association, or vivid image), written entirely in ${lang} (the language being practiced, NOT Arabic), to help the word stick in memory. This is NOT a clue to the answer, it's a memory trick.
- "pastForm": see rule below
${germanRule}
Respond with ONLY a raw JSON array, no markdown fences, no commentary. Schema:
[{"term":"","meaning_ar":"","meaning_alts":[],"sentences":["","",""],"distractors":["","",""],"mnemonic":"","pastForm":""}]`;

  let content;
  if(imageFile){
    const b64 = await fileToBase64(imageFile);
    content = [
      {type:'image', source:{type:'base64', media_type: imageFile.type || 'image/jpeg', data:b64}},
      {type:'text', text: prompt}
    ];
  } else {
    content = [{type:'text', text: prompt + '\n\nContent:\n' + text}];
  }
  return await callClaude(content);
}

Then generate 8 multiple-choice questions that test those rules/concepts (application of the rule, not memorization of the raw text). Wrong options should be plausible mistakes at the requested difficulty (easy = fairly distinct wrong options, hard = close near-miss wrong options).

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function playSuccess(){
  if(SETTINGS.muted) return;
  const el = document.getElementById('success-sound');
  el.currentTime = 0;
  el.play().catch(()=>{});
}
function playFail(){
  if(SETTINGS.muted) return;
  const el = document.getElementById('fail-sound');
  el.currentTime = 0;
  el.play().catch(()=>{});
}

// Browsers only allow audio.play() as a DIRECT result of a user gesture (click/tap).
// Our answer handlers do an `await` (reading storage) before calling playSuccess()/playFail(),
// which breaks that direct link and causes the sound to be silently blocked.
// Fix: "unlock" both audio elements on the very first tap anywhere in the app —
// once a media element has successfully played once within a real user gesture,
// browsers allow it to be played programmatically afterward, even from async code.
document.addEventListener('click', function unlockAudioOnce(){
  ['success-sound','fail-sound'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const prevMuted = el.muted;
    el.muted = true;
    el.play().then(()=>{
      el.pause();
      el.currentTime = 0;
      el.muted = prevMuted;
    }).catch(()=>{ el.muted = prevMuted; });
  });
  document.removeEventListener('click', unlockAudioOnce);
}, {once:true});

const RECENT_GAP = 5;
let recentPicks = {}; // per deckKey: array of recently shown word ids, oldest first

function pickNextCard(deck){
  const active = deck.filter(w=>w.streak < 6);
  const key = route.deckKey;
  if(!recentPicks[key]) recentPicks[key] = [];
  const recent = recentPicks[key];
  let pool = active.filter(w=>!recent.includes(w.id));
  if(pool.length===0){
    // deck is smaller than the gap — just avoid repeating the very last word shown
    const lastId = recent[recent.length-1];
    pool = active.filter(w=>w.id!==lastId);
    if(pool.length===0) pool = active; // only one word total, nothing else to do
  }
  const choice = shuffle(pool)[0];
  studyState.current = choice.id;
  studyState.revealed = false;
  studyState.hintShown = false;
  studyState.sentenceIdx = Math.floor(Math.random()*3);
  recent.push(choice.id);
  if(recent.length > RECENT_GAP) recent.shift();
}

function pickDistractors(deck, word){
  const correctSet = new Set([word.meaning_ar, ...(word.meaning_alts||[])].map(normalizeArabic));
  const pool = [];
  const seen = new Set();
  deck.forEach(w=>{
    if(w.id===word.id) return;
    [w.meaning_ar, ...(w.meaning_alts||[])].forEach(c=>{
      const norm = normalizeArabic(c);
      if(c && !correctSet.has(norm) && !seen.has(norm)){
        seen.add(norm);
        pool.push(c);
      }
    });
  });
  let picks = shuffle(pool).slice(0,3);
  if(picks.length < 3){
    const pickedNorms = new Set(picks.map(normalizeArabic));
    const fallback = (word.distractors||[]).filter(d=>{
      const norm = normalizeArabic(d);
      return d && !correctSet.has(norm) && !pickedNorms.has(norm);
    });
    picks = picks.concat(fallback.slice(0, 3 - picks.length));
  }
  // last resort (tiny deck, thin fallback list) — repeat existing distractors rather than show fewer than 3
  let i = 0;
  while(picks.length < 3 && word.distractors && word.distractors.length){
    picks.push(word.distractors[i % word.distractors.length]);
    i++;
  }
  return picks;
}

  if(useOptions){
    const opts = shuffle([word.meaning_ar, ...pickDistractors(deck, word)]);

function normalizeArabic(s){
  if(!s) return '';
  return s
    .replace(/[\u064B-\u065F\u0670]/g, '') // strip tashkeel/diacritics
    .replace(/[أإآٱ]/g, 'ا')                // unify alef forms (hamza variants) to bare alef
    .replace(/ى/g, 'ي')                     // alef maksura -> ya
    .replace(/ة/g, 'ه')                     // ta marbuta -> ha
    .replace(/[ؤئ]/g, 'ي')                  // hamza-on-carrier -> ya (loose match)
    .replace(/ء/g, '')                      // drop standalone hamza
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

// A single wrong letter, or a small phrasing difference (e.g. "نتيجة الى ذلك" vs
// "نتيجة لذلك"), shouldn't count as a wrong answer — only a genuinely different
// answer should. Tolerance scales with length: short words allow ~2 chars off,
// longer phrases allow proportionally more.
function fuzzyArabicMatch(input, target){
  const a = normalizeArabic(input);
  const b = normalizeArabic(target);
  if(!a || !b) return a === b;
  if(a === b) return true;
  const dist = levenshtein(a, b);
  const tolerance = Math.max(2, Math.round(Math.max(a.length, b.length) * 0.25));
  return dist <= tolerance;
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}

async function handleAnswer(word, correct, btnEl, containerEl, spellingClose){
  const deck = await getDeck(route.deckKey, route.ephemeral);
  const idx = deck.findIndex(w=>w.id===word.id);
  if(idx===-1) return;
  const w = deck[idx];

  if(containerEl && containerEl.classList.contains('options-grid')){
    Array.from(containerEl.children).forEach(b=>{
      if(b.textContent === w.meaning_ar) b.classList.add('correct');
    });
    if(!correct) btnEl.classList.add('wrong');
  }

  if(correct){
    playSuccess();
    if(w.stage < 2){
      w.stage += 1;
      w.wrongStreak = 0;
    } else {
      w.streak = Math.min(6, w.streak + 1);
      w.wrongStreak = 0;
      if(w.streak >= 6){
        const rest = deck.filter(x=>x.id!==w.id);
        await setDeck(route.deckKey, rest, route.ephemeral);
        const mastered = await getMastered(route.deckKey, route.ephemeral);
        mastered.push({term:w.term, meaning_ar:w.meaning_ar, pastForm:w.pastForm||''});
        await setMastered(route.deckKey, mastered, route.ephemeral);
        toast(`"${w.term}" mastered! Moved to your mastered list.`);
        setTimeout(async ()=>{ const d2 = await getDeck(route.deckKey, route.ephemeral); if(d2.length){ pickNextCard(d2); render(); } else { go({...route, screen:'vocab_manage'}); } }, 700);
        return;
      }
    }
    await setDeck(route.deckKey, deck, route.ephemeral);
    setTimeout(async ()=>{ const d2 = await getDeck(route.deckKey, route.ephemeral); pickNextCard(d2); render(); }, 500);
  } else {
    flashWrong();
    playFail();
    if(w.stage >= 2 && w.streak > 0){
      w.streak = Math.max(0, w.streak - (spellingClose ? 1 : 2));
    } else {
      w.wrongStreak += 1;
      if(w.wrongStreak >= 2){
        w.stage = 0;
        w.wrongStreak = 0;
        await setDeck(route.deckKey, deck, route.ephemeral);
        studyState.revealed = true;
        render();
        return;
      }
      w.stage = 0;
    }
    await setDeck(route.deckKey, deck, route.ephemeral);
    setTimeout(()=>{ render(); }, 500);
  }
}

const DRILL_CONFIGS = {
  physics: {label:'Physics', language:'English', speakLang:'en-US', domain:'physics equations, problems, and definitions'},
  history: {label:'History', language:'Arabic', speakLang:'ar-SA', domain:'history facts, dates, and events'},
  math_algebra: {label:'Algebra', language:'English', speakLang:'en-US', domain:'algebra equations and problems'},
  math_geometry: {label:'Geometry', language:'English', speakLang:'en-US', domain:'geometry problems, theorems, and formulas'}
};

async function extractDrill(text, imageFile, difficulty, cfg){
  const diffInstructions = {
    easy: 'Keep questions to direct, single-step application of a formula, fact, or definition. Wrong options should be clearly different from the correct one.',
    medium: 'Questions should require one or two steps of reasoning or substitution. Wrong options should be plausible mistakes.',
    hard: 'Questions should require multi-step reasoning, combining concepts, or noticing a subtlety in the problem. Wrong options should be very close near-misses.'
  };
  const prompt = `You are building practice questions from material a student uploaded (${cfg.domain}).
Go through the ENTIRE content and create ONE question for EVERY distinct item you find — do not skip anything, do not cap the count, cover it all completely.
Difficulty requested: ${difficulty}. ${diffInstructions[difficulty] || diffInstructions.medium}
Write EVERYTHING — the question, the answer, the distractors, and the hint — entirely in ${cfg.language}.
For each item provide:
- "question": the question prompt, clear and self-contained
- "answer": the correct answer (a value, expression, or short phrase — exact form the student should type back)
- "distractors": exactly 3 plausible-but-wrong answers in the same format as "answer"
- "hint": one short, subtle nudge (not the answer, not a strong clue) — only helps if the student already half-knows it. Never state or imply the final answer.
Respond with ONLY a raw JSON array, no markdown fences, no commentary. Schema:
[{"question":"","answer":"","distractors":["","",""],"hint":""}]`;
  let content;
  if(imageFile){
    const b64 = await fileToBase64(imageFile);
    content = [
      {type:'image', source:{type:'base64', media_type: imageFile.type || 'image/jpeg', data:b64}},
      {type:'text', text: prompt}
    ];
  } else {
    content = [{type:'text', text: prompt + '\n\nContent:\n' + text}];
  }
  return await callClaude(content);
}

      hbtn.textContent = drillStudyState.hintShown ? 'Hint used' : 'Hint';
      hbtn.disabled = drillStudyState.hintShown;
      hbtn.onclick = ()=>{ drillStudyState.hintShown = true; render(); };
      hintRow.appendChild(hbtn);
      main.appendChild(hintRow);
      if(drillStudyState.hintShown){
        const box = document.createElement('div'); box.className='hint-box';
        box.textContent = item.hint;
        main.appendChild(box);
      }
    }
  } else {
    const row = document.createElement('div'); row.className='recall-row';
    const inp = document.createElement('input'); inp.type='text'; inp.style.direction='ltr'; inp.style.textAlign='left'; inp.placeholder='Type the answer';
    row.appendChild(inp);
    const submit = document.createElement('button'); submit.className='btn'; submit.textContent='Check';
    submit.onclick = ()=>{
      const correct = fuzzyArabicMatch(inp.value, item.answer);
      handleDrillAnswer(item, correct, submit, row, drillKey);
    };
    row.appendChild(submit);
    main.appendChild(row);
  }
}

function pickNextDrill(deck){
  const drillKey = drillStudyState.drillKey;
  if(!recentPicks['drill:'+drillKey]) recentPicks['drill:'+drillKey] = [];
  const recent = recentPicks['drill:'+drillKey];
  let pool = deck.filter(w=>!recent.includes(w.id));
  if(pool.length===0){
    const lastId = recent[recent.length-1];
    pool = deck.filter(w=>w.id!==lastId);
    if(pool.length===0) pool = deck;
  }
  const choice = shuffle(pool)[0];
  drillStudyState.current = choice.id;
  drillStudyState.revealed = false;
  drillStudyState.hintShown = false;
  recent.push(choice.id);
  if(recent.length > RECENT_GAP) recent.shift();
}

async function handleDrillAnswer(item, correct, btnEl, containerEl, drillKey){
  const deck = await getDeck('drill:'+drillKey);
  const idx = deck.findIndex(w=>w.id===item.id);
  if(idx===-1) return;
  const it = deck[idx];

  if(containerEl && containerEl.classList.contains('options-grid')){
    Array.from(containerEl.children).forEach(row=>{
      const innerBtn = row.classList && row.classList.contains('option-btn') ? row : row.querySelector('.option-btn');
      if(innerBtn && innerBtn.textContent === it.answer) innerBtn.classList.add('correct');
    });
    if(!correct) btnEl.classList.add('wrong');
  }

  if(correct){
    playSuccess();
    if(it.stage===0){
      it.stage = 1;
      it.wrongStreak = 0;
      await setDeck('drill:'+drillKey, deck);
      setTimeout(async ()=>{ const d2 = await getDeck('drill:'+drillKey); pickNextDrill(d2); render(); }, 500);
    } else {
      const rest = deck.filter(x=>x.id!==it.id);
      await setDeck('drill:'+drillKey, rest);
      toast('Question complete!');
      setTimeout(async ()=>{ const d2 = await getDeck('drill:'+drillKey); if(d2.length){ pickNextDrill(d2); render(); } else { go(drillStudyState.backTo || {screen:'drill_manage', drillKey}); } }, 600);
    }
  } else {
    flashWrong();
    playFail();
    it.wrongStreak += 1;
    if(it.wrongStreak >= 2){
      it.stage = 0;
      it.wrongStreak = 0;
      await setDeck('drill:'+drillKey, deck);
      drillStudyState.revealed = true;
      render();
      return;
    }
    it.stage = 0;
    await setDeck('drill:'+drillKey, deck);
    setTimeout(()=>{ render(); }, 500);
  }
}

function friendlyAuthError(e){
  const code = (e && e.code) || '';
  if(code.includes('email-already-in-use')) return 'That email already has an account — try logging in instead.';
  if(code.includes('invalid-email')) return 'That email looks invalid.';
  if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(code.includes('wrong-password') || code.includes('invalid-credential')) return 'Wrong email or password.';
  if(code.includes('user-not-found')) return 'No account with that email — try signing up instead.';
  return 'Something went wrong — try again.';
}

async function tryInitFirebase(){
  const cfg = getFirebaseConfig();
  if(!cfg){ route = {screen:'home'}; return; }
  if(!window.__firebase){
    await new Promise(res=>{
      window.addEventListener('firebase-sdk-ready', res, {once:true});
      setTimeout(res, 5000);
    });
  }
  if(!window.__firebase){ route = {screen:'home'}; return; }
  try{
    fbApp = window.__firebase.initializeApp(cfg);
    fbAuth = window.__firebase.getAuth(fbApp);
    fbDb = window.__firebase.getFirestore(fbApp);
    await new Promise(resolve=>{
      window.__firebase.onAuthStateChanged(fbAuth, (user)=>{
        currentUser = user;
        const cameFromLoggedOutFlow = !route || route.screen==='auth' || route.screen==='home';
        if(cameFromLoggedOutFlow){
          route = user ? {screen:'home'} : {screen:'auth'};
        }
        render();
        resolve();
      });
    });
  }catch(e){
    console.error('Firebase init failed', e);
    route = {screen:'home'};
  }
}
